name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - if: runner.os == 'Linux'
        run: python3 tests/compatibility/run_compatibility.py all --tier smoke --no-build
      - run: python scripts/package_release.py --binary target/release/graphite${{ runner.os == 'Windows' && '.exe' || '' }} --platform ${{ runner.os }}-${{ runner.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: graphite-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
  minimum-rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - run: cargo check --locked
  ogdf:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - run: cargo test --locked --features ogdf

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-20
          targets: wasm32-unknown-unknown
          components: rust-src,clippy
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Clippy (WASM)
        run: cargo +nightly-2026-09-20 -Z build-std=std,panic_abort clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
      - run: ./scripts/build-web.sh
