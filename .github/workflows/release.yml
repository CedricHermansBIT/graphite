name: Prepare release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: python scripts/package_release.py --binary target/release/graphite${{ runner.os == 'Windows' && '.exe' || '' }} --platform ${{ runner.os }}-${{ runner.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_release.py --source
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, source]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --generate-notes
