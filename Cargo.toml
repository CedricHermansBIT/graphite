[package]
name = "graphite"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Desktop viewer for large GFA assembly graphs"
license = "GPL-3.0-only"
repository = "https://github.com/CedricHermansBIT/graphite"

[[bin]]
name = "graphite"
path = "src/main.rs"

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
cuda = ["gpu", "dep:cudarc"]
# Optional Bandage/OGDF reference backend. Enabling this feature requires the
# Bandage submodule and a C++14 compiler; the default Rust-only build does not.
ogdf = ["dep:cc"]

[dependencies]
eframe = { version = "0.36.2", features = ["default", "persistence", "glow"] }
egui = "0.36.2"
rayon = "1.12.0"
ahash = "0.8"
memmap2 = "0.9"
memchr = "2"
anyhow = "1.0.104"
log = "0.4.34"
env_logger = "0.11.11"
argh = "0.1.19"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
image = { version = "0.25.10", default-features = false, features = ["png"] }
flate2 = "1"
tempfile = "3"
csv = "1"
ab_glyph = "0.2"
sha2 = "0.10"
same-file = "1"
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
cudarc = { version = "0.19.9", optional = true, default-features = false, features = ["driver", "nvrtc", "dynamic-loading", "cuda-12000"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
[build-dependencies]
cc = { version = "1.4.6", features = ["parallel"], optional = true }
