[package]
name = "graphite"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "graphite"
path = "src/main.rs"

[features]
default = []
# Optional Bandage/OGDF reference backend. Enabling this feature requires the
# Bandage submodule and a C++14 compiler; the default Rust-only build does not.
ogdf = ["dep:cc"]

[dependencies]
eframe = { version = "0.36.2", features = ["default"] }
egui = "0.36.2"
rayon = "1.12.0"
ahash = "0.8"
memmap2 = "0.9"
anyhow = "1.0.104"
log = "0.4.34"
env_logger = "0.11.11"
argh = "0.1.19"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
image = "0.25.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
[build-dependencies]
cc = { version = "1.4.6", features = ["parallel"], optional = true }
